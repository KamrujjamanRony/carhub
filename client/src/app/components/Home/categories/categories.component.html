<!-- categories -->
<div class="container py-2 lg:py-16">
  <h2
    class="text-lg lg:text-3xl font-medium text-secondary uppercase mb-1 lg:mb-6"
  >
    shop by category
  </h2>
  <div
    class="category-slider"
    (window:resize)="onResize()"
    [style.--cards-per-view]="cardsPerViewStyle()"
  >
    @if (hasSliderControls()) {
      <button
        type="button"
        class="slider-btn slider-btn-left"
        (click)="prevSlide()"
        [disabled]="isPrevDisabled()"
        aria-label="Previous categories"
      >
        &#10094;
      </button>
      <button
        type="button"
        class="slider-btn slider-btn-right"
        (click)="nextSlide()"
        [disabled]="isNextDisabled()"
        aria-label="Next categories"
      >
        &#10095;
      </button>
    }

    <div class="category-viewport">
      <div class="category-track" [style.transform]="getTrackTransform()">
        @for (item of categories(); track $index; let i = $index) {
          <a
            [routerLink]="['/shop']"
            [queryParams]="{ category: item.name }"
            class="category-card relative rounded-sm overflow-hidden group"
          >
            <img
              [src]="item.image"
              class="w-full category-image"
              [alt]="item.name"
              (error)="onImageError(i)"
            />
            <span
              class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center text-xl text-gray-50 font-roboto font-medium group-hover:bg-opacity-50 transition"
              >{{ item.name }}</span
            >
          </a>
        }
      </div>
    </div>
  </div>
</div>
<!-- categories end -->
